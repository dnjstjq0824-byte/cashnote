openapi: 3.1.0
info:
  title: BN Merchant OS Enterprise API
  version: 1.0.0
  summary: 글로벌 소상공인 통합 경영관리 플랫폼 전체 26개 API 그룹 명세
  description: |
    BN Merchant OS 마스터 블루프린트(`BN-MERCHANT-OS-GEMINI4-ARGON-MASTER-BLUEPRINT-1000-001`) 제20조에 따른 OpenAPI 3.1.0 공식 명세서.
    - 모든 테넌트 종속 API는 `Authorization: Bearer <JWT>` 및 `X-Store-Id: <UUID>` 헤더를 필수로 요구합니다.
    - 모든 상태 변경(`POST`, `PUT`, `PATCH`) 요청은 중복 실행 방지를 위해 `Idempotency-Key: <UUID>` 헤더를 요구합니다.
    - 실제 계약되지 않은 외부 API는 가상의 성공 응답을 반환하지 않고 `409 Conflict` / `422 Unprocessable Entity` (`CONNECTOR_EXTERNAL_BLOCKED`)와 함께 Level 2 파일 업로드 대체 경로를 안내합니다.
  contact:
    name: BN Merchant OS Architecture Team
  license:
    name: Proprietary - Booking Network Platform
servers:
  - url: https://api.merchant-os.bookingnetwork.internal/v1
    description: Production API Gateway
  - url: https://staging-api.merchant-os.bookingnetwork.internal/v1
    description: Staging & Partner Sandbox Gateway
  - url: http://localhost:8080/v1
    description: Local Modular Monolith Development Server

tags:
  - name: 01_Authentication
    description: 로그인, 회원가입, OIDC 소셜 로그인, MFA, 토큰 갱신
  - name: 02_Users
    description: 내 프로필, 활성 기기/세션, 개인정보 동의 및 계정 탈퇴
  - name: 03_BusinessVerification
    description: 사업자 등록, 국세청 진위/상태 조회, 1원 계좌인증, 소유권 서류 검증
  - name: 04_Stores
    description: 사업장(점포) 생성, 다매장 목록, 다매장 합산, 소유권 이전
  - name: 05_Permissions
    description: 매니저/회계/세무대리인 초대 및 RBAC/ABAC 권한 관리
  - name: 06_CardSales
    description: 카드 승인, 매입, 취소, 수수료율 및 카드매출 캘린더
  - name: 07_Settlements
    description: 카드사·PG·배달 플랫폼 지급 예정 스케줄 및 정산 명세
  - name: 08_BankDeposits
    description: 사업용 은행 계좌 잔액 및 실제 입출금 내역 조회
  - name: 09_Reconciliation
    description: 지급 예정 vs 실제 입금 자동 대사, 미지급·누락 진단, 이의제기
  - name: 10_Expenses
    description: 고정비·변동비 지출 관리, 거래처 관리, 영수증 OCR
  - name: 11_Ledger
    description: 불변 복식부기 분개장, 시산표, 손익계산서(P&L), 역분개 정정, 회계마감
  - name: 12_Tax
    description: 전자세금계산서, 현금영수증, 부가세 예상 시뮬레이션, 세무사 자료 공유
  - name: 13_POSConnector
    description: POS/VAN/PG 어댑터 설정 및 표준 주문·결제 수신 웹훅
  - name: 14_DeliveryConnector
    description: 배달 플랫폼 매출·정산 파일 파싱 및 공식 제휴 커넥터
  - name: 15_Reviews
    description: 매장 리뷰 통합 조회, 감성 키워드 분석, 공식 API 답글 및 AI 초안
  - name: 16_CRM
    description: 익명 방문 코호트 분석, 마케팅 동의 단골 세그먼트, 알림톡 캠페인
  - name: 17_Analytics
    description: 일·주·월 경영 KPI, 시간대별 히트맵, 상권 비교, 다매장 벤치마크
  - name: 18_AIInsights
    description: 매출 예측, 현금흐름 전망, 비용 이상치 탐지, 운영 질의응답
  - name: 19_Notifications
    description: 모닝 브리핑 알림톡, 푸시 알림 목록, 야간 발송 제한 및 수신 설정
  - name: 20_Subscriptions
    description: 무료/Plus/Pro 멤버십 구독, 빌링키 결제, 해지 및 환불
  - name: 21_Marketplace
    description: 소상공인 B2B 식자재·비품 카탈로그, 장바구니, 주문 및 장부 자동 반영
  - name: 22_Community
    description: 사업자 인증 커뮤니티 게시판, 업종/지역 토픽, 신고 및 차단
  - name: 23_Admin
    description: 플랫폼 운영 관리자 콘솔, 사업자 심사, 커넥터 제어, 4-Eyes 승인
  - name: 24_Audit
    description: SHA-256 해시 체인 감사 로그 조회 및 원장 무결성 검증
  - name: 25_Partner
    description: 외부 POS/VAN/공급사 파트너 전용 웹훅 및 정산 API
  - name: 26_ImportExport
    description: Level 2 정산 파일(CSV/XLSX) 업로드 및 세무/회계 자료 내보내기

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC 호환 RS256/ES256 서명 Access Token (유효기간 15분)
    PartnerHmacAuth:
      type: apiKey
      in: header
      name: X-Partner-Signature
      description: 외부 파트너 Inbound Webhook HMAC-SHA256 서명

  parameters:
    StoreIdPath:
      name: storeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 대상 사업장(Store) 고유 UUID (서버 측 RBAC/ABAC 및 RLS 강제 검증)
    BusinessIdPath:
      name: businessId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 대상 사업자(Business) 고유 UUID
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 중복 요청 방지를 위한 클라이언트 생성 고유 키 (24시간 유지)
    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  schemas:
    DataProvenanceMeta:
      type: object
      required:
        - source_level
        - freshness_status
        - last_synced_at
      properties:
        source_level:
          type: string
          enum: [LEVEL_1_MANUAL, LEVEL_2_FILE, LEVEL_3_API, LEVEL_4_RECONCILED]
        provider_code:
          type: string
          examples: ["CREFIA_CARDSALES", "KFTC_OPENBANKING", "POPBILL_TAX", "MANUAL_UPLOAD"]
        freshness_status:
          type: string
          enum: [REALTIME_VERIFIED, DAILY_BATCH_SYNCED, FILE_IMPORTED, MANUAL_ENTRY, SYNC_DELAYED, BLOCKED_CONTRACT]
        last_synced_at:
          type: string
          format: date-time
        raw_import_batch_id:
          type: ["string", "null"]
          format: uuid

    PaginationMeta:
      type: object
      required:
        - limit
        - has_next
      properties:
        limit:
          type: integer
        next_cursor:
          type: ["string", "null"]
        total_count:
          type: integer
        has_next:
          type: boolean

    ErrorResponse:
      type: object
      required:
        - request_id
        - error
      properties:
        request_id:
          type: string
          format: uuid
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              examples: ["AUTH_FORBIDDEN_STORE", "CONNECTOR_EXTERNAL_BLOCKED", "LEDGER_UNBALANCED_ENTRY", "VALIDATION_FAILED"]
            message:
              type: string
            actionable_fallback:
              type: ["string", "null"]
              description: 외부 API 미승인/장애 시 Level 2 파일 업로드 등 대체 경로 안내
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  reason:
                    type: string

    MonetaryBreakdown:
      type: object
      description: 제7조 원칙에 따라 승인액·매입액·순정산예정액·실제입금액·회계매출액을 엄격히 분리한 구조체
      required:
        - currency_code
        - authorized_amount
        - captured_amount
        - fee_amount
        - net_settlement_scheduled_amount
        - actual_bank_deposit_amount
        - accounting_supply_sales_amount
        - vat_amount
      properties:
        currency_code:
          type: string
          default: KRW
        authorized_amount:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]{1,4})?$"
          description: 카드/결제 승인 총액 (NUMERIC 문자열 직렬화)
        captured_amount:
          type: string
          description: 전표 매입 확정액
        fee_amount:
          type: string
          description: 카드사/PG/배달 수수료 공제액
        net_settlement_scheduled_amount:
          type: string
          description: 수수료 및 상계 차감 후 지급 예정액
        actual_bank_deposit_amount:
          type: string
          description: 실제 은행 계좌 입금 확인액
        accounting_supply_sales_amount:
          type: string
          description: 부가세 제외 회계상 순매출액(공급가액)
        vat_amount:
          type: string
          description: 부가가치세 예수금

paths:
  /auth/register:
    post:
      tags: [01_Authentication]
      summary: 이메일 및 휴대전화 본인인증 기반 신규 회원가입
      operationId: registerUser
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name, phone_verification_token, terms_agreed]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 10
                full_name:
                  type: string
                phone_verification_token:
                  type: string
                terms_agreed:
                  type: boolean
      responses:
        "201":
          description: 회원가입 완료 및 OIDC 토큰 발급
        "409":
          description: 이미 가입된 이메일 또는 전화번호
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [01_Authentication]
      summary: 이메일/비밀번호 또는 OIDC 소셜 로그인 및 MFA 챌린지
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [PASSWORD, KAKAO_OIDC, GOOGLE_OIDC, APPLE_OIDC]
                email:
                  type: string
                password:
                  type: string
                oidc_id_token:
                  type: string
      responses:
        "200":
          description: 인증 성공 또는 MFA 요구

  /users/me:
    get:
      tags: [02_Users]
      summary: 현재 로그인한 사용자 프로필 및 소속 사업장/권한 목록 조회
      operationId: getMyProfile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 사용자 프로필 및 소속 매장 목록 반환

  /users/me/consents/{consentId}/revoke:
    post:
      tags: [02_Users]
      summary: 데이터 연결 및 제3자 제공 동의 즉시 철회 (Scenario I)
      operationId: revokeConsent
      security:
        - BearerAuth: []
      parameters:
        - name: consentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: 동의 철회 및 외부 연동 토큰 즉시 파기 완료

  /businesses:
    post:
      tags: [03_BusinessVerification]
      summary: 신규 개인/법인 사업자 등록 및 국세청 진위/상태 1차 검증
      operationId: createBusiness
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country_code, registration_number, legal_name, representative_name, opened_date, business_type]
              properties:
                country_code:
                  type: string
                  default: KR
                registration_number:
                  type: string
                  example: "1234567890"
                legal_name:
                  type: string
                representative_name:
                  type: string
                opened_date:
                  type: string
                  format: date
                business_type:
                  type: string
                  enum: [INDIVIDUAL_GENERAL, INDIVIDUAL_SIMPLIFIED, INDIVIDUAL_EXEMPT, CORPORATION]
      responses:
        "201":
          description: 사업자 등록 및 국세청 상태조회 완료 (소유권 확인은 PENDING 상태)

  /businesses/{businessId}/verify-ownership:
    post:
      tags: [03_BusinessVerification]
      summary: 사업장 실제 소유권 검증 (1원 계좌인증 또는 대표자 증빙서류 제출)
      operationId: verifyBusinessOwnership
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BusinessIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_method]
              properties:
                verification_method:
                  type: string
                  enum: [PENNY_BANK_AUTH, OCR_CERTIFICATE, POWER_OF_ATTORNEY_MANUAL]
                bank_code:
                  type: string
                account_number:
                  type: string
                penny_auth_code:
                  type: string
                evidence_s3_key:
                  type: string
      responses:
        "200":
          description: 소유권 검증 상태 갱신 (`VERIFIED_OWNER` 또는 `PENDING_REVIEW`)

  /stores:
    get:
      tags: [04_Stores]
      summary: 내가 접근 권한을 가진 전체 매장 목록 조회
      operationId: listAccessibleStores
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 매장 목록 및 매장별 내 역할(Role) 반환
    post:
      tags: [04_Stores]
      summary: 인증된 사업자 하위 신규 매장(점포) 추가
      operationId: createStore
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_id, name, vertical_type]
              properties:
                business_id:
                  type: string
                  format: uuid
                name:
                  type: string
                vertical_type:
                  type: string
                  enum: [FNB_RESTAURANT, FNB_CAFE_BAKERY, RETAIL_COMMERCE, SERVICE_BEAUTY_ACADEMY, OTHER]
                currency_code:
                  type: string
                  default: KRW
                timezone:
                  type: string
                  default: Asia/Seoul
      responses:
        "201":
          description: 매장 생성 완료

  /stores/{storeId}/members:
    get:
      tags: [05_Permissions]
      summary: 매장 소속 직원·매니저·회계담당·세무대리인 권한 목록 조회
      operationId: listStoreMembers
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
      responses:
        "200":
          description: 매장 구성원 및 역할 목록 반환
    post:
      tags: [05_Permissions]
      summary: 매니저·회계담당·세무대리인 초대 발송 (RBAC/ABAC)
      operationId: inviteStoreMember
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email_or_phone, role_code]
              properties:
                email_or_phone:
                  type: string
                role_code:
                  type: string
                  enum: [CO_OWNER, MANAGER, ACCOUNTANT, TAX_AGENT, STAFF, VIEWER]
                valid_until:
                  type: ["string", "null"]
                  format: date-time
      responses:
        "201":
          description: 초대 토큰 생성 및 알림톡/이메일 발송 완료

  /stores/{storeId}/card-sales/summary:
    get:
      tags: [06_CardSales]
      summary: 기간별 카드 승인·매입·취소·수수료·정산예정·실입금 분리 집계 조회
      operationId: getCardSalesSummary
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 5단계 분리 금액 및 데이터 출처 메타데이터 반환
          content:
            application/json:
              schema:
                type: object
                required: [data_provenance, totals, by_card_acquirer]
                properties:
                  data_provenance:
                    $ref: "#/components/schemas/DataProvenanceMeta"
                  totals:
                    $ref: "#/components/schemas/MonetaryBreakdown"
                  by_card_acquirer:
                    type: array
                    items:
                      type: object

  /stores/{storeId}/settlements/schedules:
    get:
      tags: [07_Settlements]
      summary: 카드사·PG·배달 플랫폼 일자별 입금 예정 캘린더 및 지급 보류 조회
      operationId: listPayoutSchedules
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
      responses:
        "200":
          description: 정산 예정 스케줄 목록 반환

  /stores/{storeId}/bank-deposits:
    get:
      tags: [08_BankDeposits]
      summary: 사업용 계좌 입출금 내역 및 정산 대사 매칭 상태 조회
      operationId: listBankDeposits
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: 계좌 입출금 목록 및 출처 등급(`LEVEL_2_FILE` 또는 `LEVEL_3_API`) 반환

  /stores/{storeId}/reconciliation/diagnostics:
    get:
      tags: [09_Reconciliation]
      summary: 미지급·누락 매출·수수료 차액·지연 입금 후보 진단 조회 (제8조 핵심 엔진)
      operationId: getReconciliationDiagnostics
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - name: status_filter
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, DELAYED_CANDIDATE, CONFIRMED_UNPAID, VARIANCE_DETECTED, SYNC_DELAY_PENDING, RESOLVED]
      responses:
        "200":
          description: 미입금 후보 vs 데이터 갱신 지연 분리 진단 결과 및 매칭 신뢰도 점수 반환

  /stores/{storeId}/reconciliation/disputes:
    post:
      tags: [09_Reconciliation]
      summary: 대사 진단 결과 이의 제기 또는 수동 입금 매칭 보정 요청
      operationId: createReconciliationDispute
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reconciliation_match_id, dispute_type, merchant_comment]
              properties:
                reconciliation_match_id:
                  type: string
                  format: uuid
                dispute_type:
                  type: string
                  enum: [FALSE_POSITIVE_UNPAID, WRONG_BANK_MATCH, FEE_CALCULATION_ERROR, CARD_ISSUER_INQUIRY_NEEDED]
                merchant_comment:
                  type: string
                manual_bank_deposit_id:
                  type: ["string", "null"]
                  format: uuid
      responses:
        "201":
          description: 이의 제기 등록 및 재대사 트리거 완료

  /stores/{storeId}/expenses:
    get:
      tags: [10_Expenses]
      summary: 고정비·변동비 지출 내역 및 적격증빙 연결 현황 조회
      operationId: listExpenses
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
      responses:
        "200":
          description: 비용 내역 및 카테고리별 합계 반환
    post:
      tags: [10_Expenses]
      summary: 비용 지출 수기 등록 또는 영수증 OCR 결과 확정 등록
      operationId: createExpense
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expense_category_id, payment_method, incurred_at, total_amount, supply_amount, vat_amount]
              properties:
                expense_category_id:
                  type: string
                  format: uuid
                vendor_id:
                  type: ["string", "null"]
                  format: uuid
                payment_method:
                  type: string
                  enum: [CORPORATE_CARD, BUSINESS_CARD, BANK_TRANSFER, CASH, AUTO_DEBIT]
                incurred_at:
                  type: string
                  format: date-time
                total_amount:
                  type: string
                supply_amount:
                  type: string
                vat_amount:
                  type: string
                receipt_s3_key:
                  type: ["string", "null"]
      responses:
        "201":
          description: 지출 등록 및 복식부기 원장 자동 분개 완료

  /stores/{storeId}/ledger/entries/{entryId}/correct:
    post:
      tags: [11_Ledger]
      summary: 원본 거래 삭제 없는 역분개(Reversing Entry) 및 정정 분개 생성
      operationId: correctJournalEntry
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code, reason_detail, corrected_lines]
              properties:
                reason_code:
                  type: string
                reason_detail:
                  type: string
                corrected_lines:
                  type: array
                  items:
                    type: object
      responses:
        "201":
          description: 역분개 및 정정 분개 생성 완료 (`corrections` 감사 추적 기록)

  /stores/{storeId}/tax/vat-estimate:
    get:
      tags: [12_Tax]
      summary: 과세유형별(일반/간이) 부가가치세 예상 세액 시뮬레이션 및 증빙 누락 진단
      operationId: getVatEstimate
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - name: tax_year
          in: query
          required: true
          schema:
            type: integer
        - name: tax_period_code
          in: query
          required: true
          schema:
            type: string
            enum: [1Q_PRELIM, 1H_FINAL, 3Q_PRELIM, 2H_FINAL]
      responses:
        "200":
          description: 예상 세액, 적용 산식 스냅샷, 누락 적격증빙 건수 및 법적 면책 문구 반환

  /stores/{storeId}/connectors/pos/events:
    post:
      tags: [13_POSConnector]
      summary: 제휴 POS / VAN / PG 실시간 주문·결제·취소 이벤트 수신 및 중복 제거
      operationId: ingestPosEvent
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_code, external_order_no, event_type, transacted_at, gross_amount]
              properties:
                provider_code:
                  type: string
                external_order_no:
                  type: string
                payment_approval_no:
                  type: string
                event_type:
                  type: string
                  enum: [ORDER_PAID, ORDER_PARTIALLY_CANCELED, ORDER_CANCELED]
                transacted_at:
                  type: string
                  format: date-time
                gross_amount:
                  type: string
      responses:
        "202":
          description: POS 이벤트 수신 및 정규화·중복 제거 큐 적재 완료

  /stores/{storeId}/delivery/settlements:
    get:
      tags: [14_DeliveryConnector]
      summary: 배달 플랫폼(배민·쿠팡이츠·요기요) 주문·수수료·배달비·광고비·실정산액 조회
      operationId: getDeliverySettlements
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
      responses:
        "200":
          description: 배달 플랫폼별 정산 내역 및 데이터 출처(`LEVEL_2_FILE` 또는 `LEVEL_3_API`) 반환

  /stores/{storeId}/reviews:
    get:
      tags: [15_Reviews]
      summary: 매장 리뷰 통합 목록, 감성 키워드 및 답글 상태 조회
      operationId: listStoreReviews
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
      responses:
        "200":
          description: 리뷰 목록 및 플랫폼별 공식 API 답글 지원 여부(`supports_direct_api_reply`) 반환

  /stores/{storeId}/crm/campaigns:
    post:
      tags: [16_CRM]
      summary: 마케팅 수신 동의(Opt-in) 완료 단골 세그먼트 대상 쿠폰/알림톡 발송
      operationId: createCrmCampaign
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [segment_id, template_code, coupon_discount_amount]
              properties:
                segment_id:
                  type: string
                  format: uuid
                template_code:
                  type: string
                coupon_discount_amount:
                  type: string
      responses:
        "201":
          description: 수신 동의 검증 통과 대상자 발송 예약 완료 (야간 시간대 자동 이연)

  /stores/{storeId}/analytics/pnl:
    get:
      tags: [17_Analytics]
      summary: 기간별 관리회계 손익계산서(P&L) 및 전월·전년 비교 조회
      operationId: getStorePnlStatement
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
      responses:
        "200":
          description: 총매출 → 순매출 → 원가 → 수수료 → 인건비 → 임차료 → 추정 영업이익 및 데이터 완성도 점수 반환

  /stores/{storeId}/ai/forecasts:
    get:
      tags: [18_AIInsights]
      summary: 향후 7일/월말 매출 예측, 현금흐름 전망 및 신뢰도 등급 조회
      operationId: getAiForecasts
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
      responses:
        "200":
          description: 예측치, P10~P90 신뢰구간, 데이터 충분성 여부(`INSUFFICIENT_DATA` 시 예측 불가 명시) 반환

  /notifications:
    get:
      tags: [19_Notifications]
      summary: 내 알림 목록(모닝 브리핑, 미입금 경보, 리뷰 알림, 세무 일정) 조회
      operationId: listMyNotifications
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 알림 목록 반환

  /stores/{storeId}/subscriptions:
    post:
      tags: [20_Subscriptions]
      summary: 유료 멤버십(Plus / Pro) 정기구독 신청 및 빌링키 결제
      operationId: createSubscription
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_code, pg_billing_token]
              properties:
                plan_code:
                  type: string
                  enum: [PLUS_MONTHLY, PLUS_ANNUAL, PRO_MULTI_STORE]
                pg_billing_token:
                  type: string
      responses:
        "201":
          description: 구독 활성화 및 혜택 쿠폰팩 발급 완료

  /stores/{storeId}/marketplace/orders:
    post:
      tags: [21_Marketplace]
      summary: 소상공인 B2B 마켓 식자재·비품 주문 및 매장 비용/재고 장부 자동 연결
      operationId: createMarketplaceOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, auto_record_to_expense_ledger]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
                auto_record_to_expense_ledger:
                  type: boolean
                  default: true
      responses:
        "201":
          description: B2B 주문 결제 및 매장 비용 장부/재고 입고 연동 예약 완료

  /community/posts:
    get:
      tags: [22_Community]
      summary: 사업자 인증 커뮤니티 업종별·지역별 게시글 목록 조회 (매출 데이터와 완전 분리)
      operationId: listCommunityPosts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 커뮤니티 게시글 목록 반환

  /admin/business-verifications/{verificationId}/decide:
    post:
      tags: [23_Admin]
      summary: 관리자 사업자 소유권 증빙 심사 승인/반려
      operationId: adminDecideBusinessVerification
      security:
        - BearerAuth: []
      parameters:
        - name: verificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, justification]
              properties:
                decision:
                  type: string
                  enum: [VERIFIED, REJECTED]
                justification:
                  type: string
      responses:
        "200":
          description: 심사 결정 반영 및 감사 로그 기록 완료

  /admin/audit/integrity-verify:
    get:
      tags: [24_Audit]
      summary: 감사 로그 SHA-256 해시 체인 및 복식부기 원장 차변/대변 불변성 전수 검증
      operationId: verifySystemIntegrity
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 원장 밸런스 및 감사 로그 해시 체인 무결성 검증 결과 반환

  /partner/webhooks/{providerCode}:
    post:
      tags: [25_Partner]
      summary: 외부 제휴 기관(VAN/PG/세금계산서 ASP) 공식 Inbound Webhook 수신
      operationId: receivePartnerWebhook
      security:
        - PartnerHmacAuth: []
      parameters:
        - name: providerCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: 서명 검증 성공 및 비동기 이벤트 큐 적재 완료

  /stores/{storeId}/imports/upload:
    post:
      tags: [26_ImportExport]
      summary: Level 2 정산 파일(여신협회·카드사·은행·홈택스·배달3사 CSV/Excel) 업로드 및 파싱
      operationId: uploadSettlementFile
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [provider_code, file]
              properties:
                provider_code:
                  type: string
                  examples: ["CREFIA_EXCEL", "BAEMIN_SETTLEMENT_XLSX", "COUPANG_EATS_CSV", "HOMETAX_INVOICE_XLS", "BANK_STATEMENT_CSV"]
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: 파일 SHA-256 검증 통과 및 스트리밍 파싱 작업 시작 (`raw_import_batches` 생성)
